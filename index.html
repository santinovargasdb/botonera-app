<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Botonesmata</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📢</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="panel">
    <h1 class="logo">Botonesmata</h1>

    <div class="volumen">
      <span class="volumen-icono" id="volumen-icono" aria-hidden="true">🔊</span>
      <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.8"
             aria-label="Volumen general" />
    </div>

    <div class="acciones">
      <button class="btn btn-agregar" id="btn-agregar">+ Agregar sonido</button>
      <button class="btn btn-eliminar" id="btn-eliminar">Eliminar</button>
    </div>
  </header>

  <main>
    <p class="aviso" id="aviso" hidden></p>

    <div class="grilla" id="grilla"></div>

    <div class="vacio" id="vacio" hidden>
      <div class="vacio-icono">📢</div>
      <p>Todavía no hay sonidos.</p>
      <p>Tocá <strong>「+ Agregar sonido」</strong> para crear tu primer botón.</p>
    </div>
  </main>

  <!-- Modal para agregar un botón -->
  <dialog id="modal">
    <form method="dialog" id="form-boton">
      <h2>Nuevo sonido</h2>

      <section class="campo">
        <h3>Sonido <span class="requerido">(obligatorio)</span></h3>

        <div class="tabs" role="tablist">
          <button type="button" class="tab activa" id="tab-subir" data-tab="subir">Subir archivo</button>
          <button type="button" class="tab" id="tab-grabar" data-tab="grabar">Grabar</button>
        </div>

        <div class="tab-panel" id="panel-subir">
          <label class="btn btn-secundario btn-archivo">
            Elegir archivo de audio
            <input type="file" id="input-audio" accept="audio/*,video/mp4,.mp3,.mp4,.m4a,.wav,.ogg,.webm" hidden />
          </label>
          <p class="nota">MP3, MP4, M4A, WAV, OGG…</p>
        </div>

        <div class="tab-panel" id="panel-grabar" hidden>
          <button type="button" class="btn btn-grabar" id="btn-grabar">● Grabar</button>
          <span class="timer" id="timer" hidden>0:00</span>
          <p class="nota" id="error-mic" hidden></p>
        </div>

        <div class="preview-audio" id="preview-audio" hidden>
          <span class="listo">✓ Sonido listo</span>
          <audio controls id="audio-preview"></audio>
        </div>
      </section>

      <section class="campo">
        <h3>Imagen <span class="opcional">(opcional)</span></h3>
        <div class="fila-imagen">
          <label class="btn btn-secundario btn-archivo">
            Elegir imagen
            <input type="file" id="input-imagen" accept="image/*" hidden />
          </label>
          <img id="preview-imagen" alt="Vista previa de la imagen" hidden />
          <button type="button" class="btn btn-quitar" id="btn-quitar-imagen" hidden>Quitar</button>
        </div>
        <p class="nota">Si no elegís una, el botón muestra su número.</p>
      </section>

      <section class="campo">
        <h3>Título <span class="opcional">(opcional)</span></h3>
        <input type="text" id="input-titulo" maxlength="40" placeholder="Botón 1" />
      </section>

      <p class="nota error-guardar" id="error-guardar" hidden></p>

      <footer class="modal-pie">
        <button type="button" class="btn btn-secundario" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-confirmar" id="btn-confirmar" disabled>Agregar botón</button>
      </footer>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
